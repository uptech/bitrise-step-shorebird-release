format_version: "11"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

app:
  envs:
  - ORIGIN_SOURCE_DIR: $BITRISE_SOURCE_DIR

workflows:
  sample:
    envs:
    - SAMPLE_APP_URL: https://github.com/bitrise-samples/sample-apps-flutter-ios-android.git
    steps:
    - script:
        inputs:
        - content: |-
            #!/bin/env bash
            set -ex
            rm -rf ./_tmp
    - git::https://github.com/bitrise-steplib/bitrise-step-simple-git-clone.git:
        inputs:
        - repository_url: $SAMPLE_APP_URL
        - branch: master
        - clone_into_dir: ./_tmp
    # NOTE: the sample app needs a shorebird.yaml committed at its root (generated by running
    # `shorebird init` once against a real Shorebird app) before this step will succeed, and
    # SHOREBIRD_TOKEN must be provided as a secret for this workflow to run for real.
    - path::./:
        inputs:
        - project_location: ./_tmp
        - is_debug_mode: "true"
        - platform: android
        - android_output_type: appbundle
        - shorebird_token: $SHOREBIRD_TOKEN

  # Ad-hoc local-only workflow for testing this step against a real Shorebird-enabled Flutter project on
  # your machine, instead of the generic sample app above. Carries no project-specific info - point it at
  # any project via env vars, set in your own gitignored .bitrise.secrets.yml, e.g.:
  #
  #   envs:
  #   - SHOREBIRD_TOKEN: "sb_api_..."
  #   - LOCAL_TEST_PROJECT_LOCATION: "/absolute/path/to/your/flutter/project"
  #   - LOCAL_TEST_FLAVOR: "dev"     # optional, blank is fine if the project has no flavors
  #   - LOCAL_TEST_PLATFORM: "both"  # both|ios|android
  #   - LOCAL_TEST_FLUTTER_VERSION: "3.47.1"  # optional, blank auto-detects
  #
  # Always left in --dry-run mode here so re-running never actually uploads a release. To actually publish a
  # real release, copy the step's inputs into a one-off workflow (or edit dry_run here temporarily) rather
  # than changing the default committed here.
  local_release:
    steps:
    - path::./:
        inputs:
        - project_location: $LOCAL_TEST_PROJECT_LOCATION
        - platform: $LOCAL_TEST_PLATFORM
        - flavor: $LOCAL_TEST_FLAVOR
        - flutter_version: $LOCAL_TEST_FLUTTER_VERSION
        - dry_run: "true"
        - is_debug_mode: "true"
        - shorebird_token: $SHOREBIRD_TOKEN

  check:
    steps:
    - git::https://github.com/bitrise-steplib/steps-check.git: { }

  e2e:
    steps:
    - git::https://github.com/bitrise-steplib/steps-check.git:
        inputs:
        - workflow: e2e

  generate-readme:
    steps:
    - git::https://github.com/bitrise-steplib/steps-readme-generator.git@main: { }
